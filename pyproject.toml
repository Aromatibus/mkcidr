[tool.ruff]
# https://docs.astral.sh/ruff/
# https://docs.astral.sh/ruff/configuration/
target-version = "py310"
line-length = 110
indent-width = 4
exclude = [".git", ".venv", ".mypy_cache", "__pycache__"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = ["ALL"]
ignore = [
    "N802", # function name should be lowercase : 関数名は小文字であるべき
    "N803", # argument name should be lowercase : 引数名は小文字であるべき
    "N806", # variable in function should be lowercase : 関数内の変数は小文字であるべき
    "D100", # Missing docstring in public module : パブリックモジュールにdocstringがない
    "D101", # Missing docstring in public class : パブリッククラスにdocstringがない
    "D102", # Missing docstring in public method : パブリックメソッドにdocstringがない
    "D103", # Missing docstring in public function : パブリック関数にdocstringがない
    "D104", # Missing docstring in public package : パブリックパッケージにdocstringがない
    "D105", # Missing docstring in magic method : マジックメソッドにdocstringがない
    "D106", # Missing docstring in public nested class : パブリックネストクラスにdocstringがない
    "D107", # Missing docstring in __init__ : __init__にdocstringがない
    "BLE001", # blind-except : 例外を捕捉する際に、例外の型を指定していない
    "S311", # suspicious-non-cryptographic-random-usage : 暗号学的でない乱数生成
    "ERA001", # Found commented-out code : コメントアウトされたコードがある
    "PLR0913", # too-many-arguments : 引数が多すぎる
    "PLC1901", # compare-to-empty-string : 空文字の比較 if a == "": を if not a: に変更
    "PLR1711", # useless-return : 不要なreturn文 ※return Noneを削除する
    "RUF001", "RUF002", "RUF003", # ambiguous unicode character : ※全角記号の使用を禁止
]
fixable = ["ALL"]
unfixable = [
    "F401", # unused-import : import文に未使用の名前がある。※削除される
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"] # Ignore `E402` (import violations) : importエラーを無視する
"**/{tests,docs,tools}/*" = ["E402"] # Ignore `E402` (import violations) : importエラーを無視する


[tool.mypy]
# https://mypy.readthedocs.io/en/stable/index.html
python_version = "3.10"
show_traceback = "True"              # mypyがクラッシュした場合にトレースバックを表示
error_summary = "True"               # エラーメッセージの概要を表示
pretty = "True"                      # エラーメッセージを見やすくフォーマット
color_output = "True"                # エラーメッセージに色を付けて表示
show_column_numbers = "True"         # エラーの発生した列番号を表示
show_error_codes = "True"            # エラーコードを表示
show_error_context = "True"          # エラーメッセージのコンテキストを表示
allow_redefinition = "False"         # 同じスコープ内での変数の再定義を禁止
allow_untyped_globals = "False"      # 型注釈がないグローバル変数の使用を禁止
check_untyped_defs = "True"          # 型注釈がない関数やメソッドに対して型チェックを実施
disallow_incomplete_defs = "True"    # 型注釈の一部が欠けている関数やメソッドの定義を禁止
disallow_untyped_defs = "True"       # 型注釈がない関数やメソッドの定義を禁止
disallow_untyped_calls = "True"      # 型注釈がない関数やメソッドの呼び出しを禁止
disallow_untyped_decorators = "True" # 型注釈がないデコレータの使用を禁止
ignore_missing_imports = "True"      # 型情報がないモジュールのインポートを無視
implicit_reexport = "False"          # 型注釈がない関数やメソッドの再エクスポートを禁止
no_implicit_optional = "True"        # Optionalの型を明示的に宣言を強制
strict = "True"                      # すべてのstrictモード関連のオプションを有効
strict_equality = "True"             # 異なる型同士の等価性の比較を禁止
strict_optional = "True"             # Noneと他の型の混在を許容しない
warn_no_return = "True"              # 戻り値がない関数やメソッドでのreturn文の省略に警告
warn_redundant_casts = "True"        # 不要な型変換に警告
warn_return_any = "True"             # `Any`型を返す関数やメソッドに警告
warn_unreachable = "True"            # 到達不能なコードに警告
warn_unused_configs = "True"         # 使用されていないconfigオプションに警告
warn_unused_ignores = "True"         # 使用されていない`# type: ignore`コメントに警告

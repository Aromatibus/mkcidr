[project]
name = "mkcidr"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Aromatibus" }
]
dependencies = [
    "netaddr>=0.10.1",
    "requests>=2.31.0",
    "types-requests>=2.31.0.20240125",
    "tqdm>=4.66.1",
    "pandas>=2.2.1",
]
readme = "README.md"
requires-python = ">= 3.10"

[project.scripts]
hello = "mkcidr:hello"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mkcidr"]
